```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Writing Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            text-align: center;
            color: #24476b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #24476b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            justify-content: center;
        }

        button:hover {
            background-color: #16324f;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #24476b;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Summary Writing Test</h1>

        <p>
            Read the information provided on the About page.
            Write a short summary in your own words and submit your details
            for verification.
        </p>

        <form action="Verify.jsp" method="post">

            <label for="name">Enter Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Enter Your Email ID:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="summary">Write Your Summary:</label>
            <textarea id="summary" name="summary" rows="8"
                placeholder="Write the summary of the information you read..." required></textarea>

            <button type="submit">Submit</button>

        </form>

        <a href="About.html" class="back-link">Back to About Page</a>

    </div>

</body>

</html>
```
